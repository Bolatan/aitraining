<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>

    <!-- Glowing Shield / Border Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Cap Top Gradient (Cyan-Blue) -->
    <linearGradient id="capGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Cap Shadow Facet Gradient (Indigo-Purple) -->
    <linearGradient id="capGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>

    <!-- Shield Hologram Base -->
    <linearGradient id="holoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="url(#neonGrad)" stroke-width="8" filter="url(#neonGlow)"/>

  <!-- Background Tech Orbit Ring -->
  <circle cx="256" cy="240" r="160" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="12 12" opacity="0.3"/>

  <!-- Lower Tech Portal / Open Code Wings Base -->
  <path d="M 120,330 L 256,390 L 392,330 L 256,290 Z" fill="url(#holoGrad)" opacity="0.4"/>
  <path d="M 120,330 L 256,390 L 392,330" fill="none" stroke="#38BDF8" stroke-width="4"/>

  <!-- Code Brackets Highlight inside Portal (< />) -->
  <path d="M 195,335 L 175,345 L 195,355" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 317,335 L 337,345 L 317,355" fill="none" stroke="#22D3EE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="268" y1="332" x2="244" y2="358" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>

  <!-- Rocket / Growth Trajectory Spark Line in Center -->
  <path d="M 256,380 L 256,190" stroke="#F59E0B" stroke-width="5" stroke-dasharray="8 6" opacity="0.8"/>

  <!-- Mortarboard Cap Skullcap Base -->
  <path d="M 170,225 Q 256,265 342,225 L 342,275 Q 256,320 170,275 Z" fill="url(#capGrad2)"/>
  <path d="M 170,275 Q 256,320 342,275" fill="none" stroke="#60A5FA" stroke-width="4"/>

  <!-- Isometric Mortarboard Diamond Top -->
  <!-- Top Light Facet -->
  <path d="M 256,105 L 436,185 L 256,225 L 76,185 Z" fill="url(#capGrad1)"/>
  <!-- Front Edge Highlight Facet -->
  <path d="M 76,185 L 256,225 L 436,185 L 256,192 Z" fill="#1D4ED8" opacity="0.9"/>

  <!-- Crisp White Outer Stroke for Tiny Scale Readability -->
  <path d="M 256,105 L 436,185 L 256,225 L 76,185 Z" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
  <line x1="76" y1="185" x2="256" y2="225" stroke="#22D3EE" stroke-width="8" stroke-linecap="round"/>

  <!-- Center Gold Button -->
  <circle cx="256" cy="188" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Glowing Tassel with Rocket/Star End -->
  <path d="M 256,188 C 330,195 385,225 405,260" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round"/>

  <!-- Glowing AI Star / Launch Spark on Tassel -->
  <g filter="url(#neonGlow)">
    <polygon points="405,235 413,252 430,260 413,268 405,285 397,268 380,260 397,252" fill="#FDE047"/>
    <circle cx="405" cy="260" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Floating Tech Sparks -->
  <circle cx="110" cy="120" r="6" fill="#22D3EE" opacity="0.9"/>
  <circle cx="410" cy="110" r="8" fill="#F59E0B" opacity="0.9"/>
  <circle cx="130" cy="280" r="5" fill="#A855F7" opacity="0.8"/>
</svg>
